name: NuGet Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (empty for stable, e.g. rc.1, beta.2)'
        required: false
        default: ''

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack all packages
        shell: pwsh
        run: ./build/nuget-pack.ps1 -VersionSuffix "${{ inputs.version_suffix }}"
        env:
          DOTNET_NOLOGO: true

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem "build/nupkgs/*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
          if ($LASTEXITCODE -ne 0) { throw "Push failed" }
